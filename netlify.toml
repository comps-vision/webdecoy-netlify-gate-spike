[build]
command = "npm run build"
publish = ".next"

# A site edge function declared in netlify.toml (user toml declaration).
[[edge_functions]]
path = "/*"
function = "site-toml"

# Redirects and rewrites the customer relies on.
[[redirects]]
from = "/redirected"
to = "/api/echo?via=redirect"
status = 301

[[redirects]]
from = "/gate/redirected"
to = "/api/echo?via=gate-redirect"
status = 301

[[redirects]]
from = "/proxied/*"
to = "/api/echo?via=rewrite"
status = 200

[[redirects]]
from = "/gate/proxied/*"
to = "/api/echo?via=gate-rewrite"
status = 200

# Rewrite probes (see edge/webdecoy-diag.ts): a static target and a Next route.
[[redirects]]
from = "/rw-plain/static/*"
to = "/target"
status = 200

[[redirects]]
from = "/rw-next/static/*"
to = "/target"
status = 200

[[redirects]]
from = "/rw-next-plain/static/*"
to = "/target"
status = 200

[[redirects]]
from = "/rw-plain/route/*"
to = "/api/echo?via=rw"
status = 200

[[redirects]]
from = "/rw-next/route/*"
to = "/api/echo?via=rw"
status = 200

[[redirects]]
from = "/rw-next-plain/route/*"
to = "/api/echo?via=rw"
status = 200
